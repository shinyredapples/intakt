name: Bug report
description: Intakt does not work as it should.
body:
  - type: markdown
    attributes:
      value: |
        See [writing a good task](https://github.com/shinyredapples/intakt/blob/main/docs/guide/writing-a-good-task.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, with any error message.
    validations:
      required: true
  - type: textarea
    id: what-you-expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest steps that make it happen again.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you ran.
    validations:
      required: true
