name: install-check
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
concurrency:
  group: install-check
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  install-check:
    # A GitHub-hosted runner is a fresh machine on every run, as a stranger's is.
    runs-on: ubuntu-24.04
    # GitHub grants a token's scopes per job; only the install check step gets the token.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, pcntl, zip
          tools: composer
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the runner's tools
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --prefix .github/install-check --no-audit --no-fund
          .github/install-check/node_modules/.bin/playwright install --with-deps chromium
          echo "NODE_PATH=$GITHUB_WORKSPACE/.github/install-check/node_modules" >> "$GITHUB_ENV"
      # The provider keys of this repository only; a fork's run checks the install without them.
      - name: Run the install check with the keys
        if: github.repository == 'shinyredapples/intakt'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_CHECK_ALARM_ACCOUNT: github-actions[bot]
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bin/install-check
      - name: Run the install check without keys
        if: github.repository != 'shinyredapples/intakt'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_CHECK_ALARM_ACCOUNT: github-actions[bot]
        run: bin/install-check
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-check
          path: var/install-check/
          if-no-files-found: warn
