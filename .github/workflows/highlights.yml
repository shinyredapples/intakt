name: highlights
# Publishes the site bin/pages assembles, the front page, the highlights page and the journey page, to GitHub Pages; it is never committed.
on:
  push:
    branches: [main]
    # Daily runs cover .github/ci/run-on-copy.sh and .github/actions/ci-image.
    paths:
      - docs/highlights.d/**
      - docs/pages/**
      - bin/highlights
      - config/gates/src/Highlight*.php
      - .github/workflows/highlights.yml
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
concurrency:
  group: highlights
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'shinyredapples/intakt' && github.ref == 'refs/heads/main'
    # On CI_RUNS_ON, logged in to Docker Hub as ci.yml's jobs are, with gh installed when the runner lacks it.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    # jekyll-build-pages reads the repository's Pages settings (jekyll-github-metadata): without pages: read its token
    # gets 403 and the build fails
    permissions:
      contents: read
      pages: read
      # bin/journey-record reads the milestones, issues and pull requests for the journey page.
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/ci/docker-hub-login.sh
      - name: Build or restore the CI image
        uses: $/.github/actions/ci-image
      - name: Install gh when the runner lacks it
        run: .github/ci/install-gh.sh
      # On the runner, because the CI image has no gh; the job's own token stays out of the container.
      - name: Record the journey's API answers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/journey-record _journey-api
      - name: Assemble the page
        # jekyll-build-pages runs Jekyll 3.10, which ignores render_with_liquid and runs Liquid on any {{ or {%. sed writes
        # each of them as a Liquid string that prints it back, so Liquid hands both pages to Markdown unchanged.
        # The front page, docs/pages/index.html, has no front matter, so Jekyll copies it as it is.
        run: |
          set -eu
          mkdir _highlights
          chmod 777 _highlights
          docker run --rm --user 1000:1000 \
            --tmpfs /home/ci:rw,exec,uid=1000,gid=1000,mode=0755,size=3g \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/_highlights:/page" \
            "$CI_IMAGE" sh /workspace/.github/ci/run-on-copy.sh sh -c 'bin/pages /page --recorded=/workspace/_journey-api && sed -i "s/{[{%]/{{ \"&\" }}/g" /page/highlights/index.md /page/journey/index.md'
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./_highlights
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
  publish:
    needs: build
    if: github.repository == 'shinyredapples/intakt' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions:
      pages: &pages-write write
      # The same value through the alias on its own line, so no value follows a key named like a credential.
      id-token:
        *pages-write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
