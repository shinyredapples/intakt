name: ci
# Every gate on each pull request (on GitHub's test merge of it) and on main, where a push that reuses a pull request's
# result skips them (the main job); a newer run of the same ref cancels the one it replaces. Once a night (schedule) and
# on demand (workflow_dispatch) every gate runs on the newest main commit, as on a direct push, in its own concurrency
# group so a push to main does not cancel it; a failure opens or updates one issue (the nightly-failed job).
# Never pull_request_target: pull-request code must not run with the base repository's secrets or write token.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-nightly' || '' }}
  cancel-in-progress: true
permissions:
  contents: read
# Each job runs where the repository variable CI_RUNS_ON says: unset, on GitHub's ubuntu-24.04; set to a JSON label list
# such as ["self-hosted","linux","x64","intakt-ci"], on a self-hosted runner. Every job is fork-guarded (it runs for a push
# to main, the nightly or on-demand run on main and pull requests from this repository only), so a fork's pull request
# and a manual run off main never reach a runner.
# A self-hosted runner must be ephemeral (a clean machine state for every job, registered --ephemeral) with no network
# path to the owner's other machines: a same-repository pull request runs its own workflow and scripts there with Docker
# access, and only a clean state keeps that from reaching a later job. A persistent self-hosted runner is not supported.
# Set the repository variable CI_DISPOSABLE_RUNNER to true when CI_RUNS_ON names a service that runs every job on a new VM
# it discards afterwards (a hosted runner service): the jobs then prepare the host as on GitHub's runners. The optional
# secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (read-only) log Docker in to Docker Hub before the jobs pull from it.
jobs:
  # A push to main whose commit already passed ci as the head of a pull request into main from this repository, in a run
  # that tested exactly the pushed commit's tree (.github/ci/pr-run-passed.sh), skips every other job. A pull request run
  # tests GitHub's merge of the head into main; its check job records that tree, and only that tree counts, usually the
  # head's own after a fast-forward land. This job then only saves the Composer and CI image caches that pull requests
  # restore. Any other push (a direct push, a release commit) runs all, and a failure of this job before it decides skips
  # no job that needs it. What a pull-request filter skips is then left to the nightly full run on main.
  main:
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.passed.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A failed lookup (an API call or git), or one LOOKUP_TIMEOUT_SECONDS stops before the job's own limit, never reads as
      # "passed": it warns and runs every job. -k kills one that ignores the stop signal.
      - name: Decide whether the commit passed as the head of a pull request into main
        id: passed
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKUP_TIMEOUT_SECONDS: 300
        run: |
          set -eu
          if ! { tree=$(timeout -k 2 "$LOOKUP_TIMEOUT_SECONDS" git rev-parse "$GITHUB_SHA^{tree}") && passed=$(timeout -k 2 "$LOOKUP_TIMEOUT_SECONDS" .github/ci/pr-run-passed.sh "$GITHUB_SHA" "$tree"); }; then
            echo "::warning::The lookup of a passed pull request run for $GITHUB_SHA failed or took over $LOOKUP_TIMEOUT_SECONDS seconds, so every job runs."
            passed=unknown
          fi
          echo "full=$([ "$passed" = yes ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "passed as the head of a pull request into main: $passed"
      - name: Name the CI image cache
        id: image-name
        if: steps.passed.outputs.full == 'false'
        run: echo "key=intakt-ci-image-$(.github/ci/build-image.sh --print-hash)" >> "$GITHUB_OUTPUT"
      - name: Look up the CI image cache
        id: image-cache
        if: steps.passed.outputs.full == 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/intakt-ci-image.tar
          key: ${{ steps.image-name.outputs.key }}
          lookup-only: true
      - name: Restore Composer's cache
        id: composer-cache
        if: steps.passed.outputs.full == 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Log in to Docker Hub
        if: steps.passed.outputs.full == 'false' && (steps.image-cache.outputs.cache-hit != 'true' || steps.composer-cache.outputs.cache-hit != 'true')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/ci/docker-hub-login.sh
      # Builds and saves the CI image when main has none cached for its inputs; loads it for Composer otherwise.
      - name: Build or restore the CI image
        if: steps.passed.outputs.full == 'false' && (steps.image-cache.outputs.cache-hit != 'true' || steps.composer-cache.outputs.cache-hit != 'true')
        uses: $/.github/actions/ci-image
      - name: Fill Composer's cache
        if: steps.passed.outputs.full == 'false' && steps.composer-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          cache="$RUNNER_TEMP/composer-cache"
          mkdir -p "$cache"
          chmod -R a+rwX "$cache"
          docker run --rm --user 1000:1000 \
            --tmpfs /home/ci:rw,exec,uid=1000,gid=1000,mode=0755,size=3g \
            --tmpfs /tmp:rw,exec,size=1g \
            --volume "$cache:/composer-cache" --env COMPOSER_CACHE_DIR=/composer-cache --env COMPOSER_CACHE_READ_ONLY=0 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$CI_IMAGE" sh /workspace/.github/ci/run-on-copy.sh true
      - name: Save Composer's cache
        if: steps.passed.outputs.full == 'false' && steps.composer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/composer-cache
          key: ${{ steps.composer-cache.outputs.cache-primary-key }}
  # bin/check runs in the CI image (.github/ci/Dockerfile: the PHP image pinned by digest plus the tools bin/check needs),
  # as uid 1000, the same steps on either kind of runner; no step runs the change's code as root or with the Docker socket.
  check:
    needs: main
    if: ${{ !cancelled() && needs.main.outputs.full != 'false' && (github.event.pull_request.head.repo.full_name == github.repository || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Ubuntu 24.04 restricts user namespaces for unprivileged users by default. Only on runners discarded after the job
      # (GitHub-hosted, or CI_DISPOSABLE_RUNNER): never on another self-hosted runner.
      - name: Allow unprivileged user namespaces
        if: runner.environment == 'github-hosted' || vars.CI_DISPOSABLE_RUNNER == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/ci/docker-hub-login.sh
      - name: Build or restore the CI image
        uses: $/.github/actions/ci-image
      # Composer's cache, keyed by the runner OS and composer.lock, so a hosted runner's fresh VM does not download every
      # dist from GitHub. Only a push to main saves it (the step after the gates); a pull request restores only.
      - name: Restore Composer's cache
        id: composer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      # The analysers' result caches (INTAKT_GATES_CACHE), so a run analyses only what changed. The key hashes composer.lock
      # and everything under config/gates/, Intakt's fixers included, since PHP CS Fixer's own cache signature ignores
      # their code. Only a push to main saves them, under a key with its commit; every run restores main's latest.
      - name: Name the gates cache
        id: gates-cache-name
        env:
          CONFIG_HASH: ${{ hashFiles('composer.lock', 'config/gates/**') }}
        run: echo "name=gates-$RUNNER_OS-$GITHUB_REF_NAME-$CONFIG_HASH-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Restore the gates cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gates-cache
          key: ${{ steps.gates-cache-name.outputs.name }}
          restore-keys: gates-${{ runner.os }}-main-${{ hashFiles('composer.lock', 'config/gates/**') }}-
      # The gate tests run processes in a new user namespace and mount a fresh /proc there. The seccomp profile is
      # Docker's default plus unshare (only together with a new user namespace) and mount. systempaths=unconfined is
      # needed because the kernel refuses a new /proc in a user namespace while Docker's masks cover parts of the old
      # one. Docker's AppArmor profile forbids mount, so it is lifted on the discarded runners (GitHub-hosted, or
      # CI_DISPOSABLE_RUNNER), whose hosts have AppArmor.
      # On a pull request the change is read against the target branch, and GitHub's synthetic test merge commit is
      # exempt from the commit-subject gate.
      - name: Run the gates
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPOSABLE_RUNNER: ${{ vars.CI_DISPOSABLE_RUNNER }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            set -- --base="origin/$BASE_REF" --test-merge="$MERGE_SHA:$HEAD_SHA"
          else
            set -- --base=origin/main
          fi
          apparmor=
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ] || [ "$DISPOSABLE_RUNNER" = true ]; then apparmor='--security-opt apparmor=unconfined'; fi
          # The home directory (the working copy, vendor/) and /tmp are tmpfs: the copy and the tests' files never touch the
          # runner's disk. Composer's cache (COMPOSER_CACHE_DIR) is the directory restored from GitHub's Actions cache. Only a
          # push to main mounts it writable and saves it afterwards: no locked package carries a checksum, so an archive a
          # pull request planted would be installed unchecked by a later main run. A pull request gets it read-only
          # (COMPOSER_CACHE_READ_ONLY) and never saves; GitHub also keeps a pull request's saves out of main's scope.
          cache="$RUNNER_TEMP/composer-cache"
          mkdir -p "$cache"
          cache_mode=:ro read_only=1
          if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then cache_mode= read_only=0; fi
          chmod -R a+rX "$cache"
          if [ "$read_only" = 0 ]; then chmod -R a+w "$cache"; fi
          gates_cache="$RUNNER_TEMP/gates-cache"
          mkdir -p "$gates_cache"
          chmod -R a+rwX "$gates_cache"
          docker run --rm --user 1000:1000 \
            --security-opt seccomp=.github/ci/seccomp-userns.json \
            --security-opt systempaths=unconfined \
            $apparmor \
            --tmpfs /home/ci:rw,exec,uid=1000,gid=1000,mode=0755,size=3g \
            --tmpfs /tmp:rw,exec,size=1g \
            --volume "$gates_cache:/gates-cache" --env INTAKT_GATES_CACHE=/gates-cache \
            --volume "$cache:/composer-cache$cache_mode" --env COMPOSER_CACHE_DIR=/composer-cache --env "COMPOSER_CACHE_READ_ONLY=$read_only" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$CI_IMAGE" sh /workspace/.github/ci/run-on-copy.sh bin/check "$@"
      - name: Save Composer's cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.composer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/composer-cache
          key: ${{ steps.composer-cache.outputs.cache-primary-key }}
      - name: Save the gates cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gates-cache
          key: ${{ steps.gates-cache-name.outputs.name }}
      # The tree this pull request run tested (GitHub's merge commit), for the push that lands the head: its main job skips
      # the full run only when this tree is the pushed commit's tree. Reached only when the gates passed. Only a pull request
      # into main records it: another base's path filters may have skipped an application change that main lacks.
      - name: Record the tested tree
        id: tested-tree
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          set -eu
          tree=$(git rev-parse "$GITHUB_SHA^{tree}")
          echo "$tree" > "$RUNNER_TEMP/tested-tree"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload the tested tree
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-tested-tree-${{ steps.tested-tree.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree
          retention-days: 30
          # A re-run of the workflow uploads the same name again; replacing it keeps a passing check green.
          overwrite: true
  # The journeys on the change itself, so one that breaks the first install or the live review page fails its own pull
  # request instead of the next nightly run. The steps and container options are those of the journeys job of journeys.yml.
  journeys:
    needs: main
    if: ${{ !cancelled() && needs.main.outputs.full != 'false' && (github.event.pull_request.head.repo.full_name == github.repository || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    # Every journey at 300 seconds plus the image build.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Decided in a step, like the image job's, so the check always reports: every push to main that the main job lets run
      # runs the journeys, a pull request only when it needs the app image (.github/ci/image-needed.sh) or touches the
      # journeys' test code (the paths below). git diff exits 1 for a change and 0 for none; any other status is a git error
      # and fails the step.
      - name: Decide on the journeys
        id: journeys
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          needed=yes
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
            needed=$(.github/ci/image-needed.sh "$base" "$HEAD_SHA")
            paths=(
              tests/Journeys                              # the journeys themselves
              tests/Support                               # StoredSerializerFactory.php, which DemoTourJourneyTest loads
              tests/Core/Watcher/RecordedPullRequests.php # the recorded answers WatcherStart loads
            )
            if [ "$needed" != yes ]; then
              status=0
              git diff --quiet "$base" "$HEAD_SHA" -- "${paths[@]}" || status=$?
              case "$status" in
                0) ;;
                1) needed=yes ;;
                *) echo "::error::git diff failed with status $status."; exit 1 ;;
              esac
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [ "$needed" = yes ]; then echo "journeys needed"; else echo "skipped: no journey inputs changed"; fi
      - name: Allow unprivileged user namespaces
        if: steps.journeys.outputs.needed == 'yes' && (runner.environment == 'github-hosted' || vars.CI_DISPOSABLE_RUNNER == 'true')
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Log in to Docker Hub
        if: steps.journeys.outputs.needed == 'yes'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/ci/docker-hub-login.sh
      - name: Build or restore the CI image
        if: steps.journeys.outputs.needed == 'yes'
        uses: $/.github/actions/ci-image
      - name: Run the journeys
        if: steps.journeys.outputs.needed == 'yes'
        env:
          DISPOSABLE_RUNNER: ${{ vars.CI_DISPOSABLE_RUNNER }}
        run: |
          set -eu
          apparmor=
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ] || [ "$DISPOSABLE_RUNNER" = true ]; then apparmor='--security-opt apparmor=unconfined'; fi
          docker run --rm --user 1000:1000 \
            --security-opt seccomp=.github/ci/seccomp-userns.json \
            --security-opt systempaths=unconfined \
            $apparmor \
            --tmpfs /home/ci:rw,exec,uid=1000,gid=1000,mode=0755,size=3g \
            --tmpfs /tmp:rw,exec,size=1g \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$CI_IMAGE" sh /workspace/.github/ci/run-on-copy.sh bin/check --journeys
  # Whether a pull request touches what the engine runs below test: the ledger, its mapping and migrations, Doctrine's
  # configuration, the dependencies, the CI definition (.github/workflows/ and .github/ci/), added lines naming
  # Doctrine anywhere in src/, or a test in group persistence that the change adds, removes or edits. A push to main
  # runs the engines only when its commit did not pass as the head of a pull request into main, so a change this filter
  # misses is caught by the nightly full run on main or by the next direct push or release commit.
  changes:
    needs: main
    if: ${{ !cancelled() && needs.main.outputs.full != 'false' && (github.event.pull_request.head.repo.full_name == github.repository || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    outputs:
      persistence: ${{ steps.paths.outputs.persistence }}
      mysql: ${{ steps.databases.outputs.mysql }}
      mariadb: ${{ steps.databases.outputs.mariadb }}
      postgresql: ${{ steps.databases.outputs.postgresql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "persistence=true" >> "$GITHUB_OUTPUT"
            echo "persistence engines needed: always on main"
            exit 0
          fi
          # .github/ci/persistence-needed.sh fails on a git error (it saves each diff first), and set -e then fails
          # this step, and the run with it, so a failing git can never read as "untouched".
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          touched=$(.github/ci/persistence-needed.sh "$base" "$HEAD_SHA")
          echo "persistence=$([ "$touched" = yes ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "persistence engines needed: $touched"
      # The database images live in .github/ci/databases.Dockerfile, where Dependabot reads them; one line per service.
      # Bash builtins only, so the runner host needs no command beyond those the job already uses.
      - id: databases
        run: |
          declare -A images
          while read -r line || [[ -n $line ]]; do
            if [[ $line =~ ^FROM\ ([^ ]+)\ AS\ (mysql|mariadb|postgresql)$ ]]; then images[${BASH_REMATCH[2]}]+="${BASH_REMATCH[1]} "; fi
          done < .github/ci/databases.Dockerfile
          for service in mysql mariadb postgresql; do
            if [[ ! ${images[$service]:-} =~ ^[^\ ]+\ $ ]]; then
              echo "::error::.github/ci/databases.Dockerfile must name one image each for mysql, mariadb and postgresql"
              exit 1
            fi
            echo "$service=${images[$service]% }" >> "$GITHUB_OUTPUT"
            echo "$service=${images[$service]% }"
          done
  # The persistence group on each supported engine; bin/check keeps running it on SQLite. One job runs all three engines
  # (a service each), in parallel inside one step: on an ephemeral self-hosted runner every job is a full machine reset,
  # so a matrix of three jobs would cost three resets and three runners per run, while one after another took about 13
  # minutes (MySQL 7, MariaDB 4.5, PostgreSQL 2). Each engine's data directory is a tmpfs: the databases are throwaway,
  # so their disk syncs only cost time. The tests run in the CI image as uid 1000 on the
  # network the runner creates for the job's services, and reach each database by its service name; no port is published
  # and there is no job container, so no Docker socket inside. The databases take no password (throwaway, never published).
  # The job's if is the fork guard behind a status check (a skipped main job must not skip it on a pull request, and a
  # changes job skipped on main skips it too), so the changes job's answer gates the steps and the database services instead:
  # when the change does not touch persistence, no service starts (an empty image) and every step is skipped.
  # The services take no Docker Hub credentials: an empty secret there is a template error that fails the job, so
  # their images pull anonymously; the steps log in like the other jobs. A changes
  # job that fails skips the engines and fails the run. Every engine runs to its end even when another fails, so the run
  # reports every engine, each in its own log group.
  persistence:
    needs: changes
    if: ${{ !cancelled() && !failure() && needs.changes.result == 'success' && (github.event.pull_request.head.repo.full_name == github.repository || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    env:
      ENGINES: ${{ needs.changes.outputs.persistence }}
    services:
      mysql:
        image: ${{ needs.changes.outputs.persistence == 'true' && needs.changes.outputs.mysql || '' }} # zizmor: ignore[unpinned-images] tag only until digests come, docs/architecture/README.md
        env:
          MYSQL_DATABASE: intakt_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: ${{ needs.changes.outputs.persistence == 'true' && needs.changes.outputs.mariadb || '' }} # zizmor: ignore[unpinned-images] tag only until digests come, docs/architecture/README.md
        env:
          MARIADB_DATABASE: intakt_test
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgresql:
        image: ${{ needs.changes.outputs.persistence == 'true' && needs.changes.outputs.postgresql || '' }} # zizmor: ignore[unpinned-images] tag only until digests come, docs/architecture/README.md
        env:
          POSTGRES_DB: intakt_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready --username=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ENGINES == 'true'
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        if: env.ENGINES == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/ci/docker-hub-login.sh
      - name: Build or restore the CI image
        id: image
        if: env.ENGINES == 'true'
        uses: $/.github/actions/ci-image
      # The check job's Composer cache (same key), restored only: the engines mount it read-only and this job never saves,
      # so only a push to main's check job writes the entry, and a pull request cannot plant an archive in it.
      - name: Restore Composer's cache
        if: env.ENGINES == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      # The test environment appends _test to the database name of the URL, so each service creates intakt_test and the URL names intakt.
      # The three engines run at once (.github/ci/persistence-engines.sh); the step fails when any fails.
      - name: Run the persistence group on each database image
        if: env.ENGINES == 'true' && !cancelled() && steps.image.outcome == 'success'
        env:
          MYSQL_IMAGE: ${{ needs.changes.outputs.mysql }}
          MARIADB_IMAGE: ${{ needs.changes.outputs.mariadb }}
          POSTGRESQL_IMAGE: ${{ needs.changes.outputs.postgresql }}
          MYSQL_NETWORK: ${{ job.services.mysql.network }}
          MARIADB_NETWORK: ${{ job.services.mariadb.network }}
          POSTGRESQL_NETWORK: ${{ job.services.postgresql.network }}
          COMPOSER_CACHE: ${{ runner.temp }}/composer-cache
        run: >-
          .github/ci/persistence-engines.sh
          "mysql|$MYSQL_IMAGE|$MYSQL_NETWORK|mysql://root@mysql:3306/intakt"
          "mariadb|$MARIADB_IMAGE|$MARIADB_NETWORK|mysql://root@mariadb:3306/intakt"
          "postgresql|$POSTGRESQL_IMAGE|$POSTGRESQL_NETWORK|postgresql://postgres@postgresql:5432/intakt"
  # The app image, built once here and never pushed, then docker/smoke-test.sh, docker/verify-first-start.sh and, when
  # needed, docker/verify-upgrade.sh on it; every check is in the scripts. One job, because each job on an ephemeral runner
  # is a full machine reset and a build. The full history is fetched for the upgrade check's base commit.
  image:
    needs: main
    if: ${{ !cancelled() && needs.main.outputs.full != 'false' && (github.event.pull_request.head.repo.full_name == github.repository || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/ci/docker-hub-login.sh
      # Decided in a step, not by a paths filter, so the job reports on every pull request. The base is the pull request's
      # merge base, or on a full push run the head's first parent. A push to main whose commit passed as the head of a pull request into
      # main skips this job; a later full run's check starts from its own first parent, so the upgrade across the skipped
      # change stays unchecked. The rest of what the check misses is left to the nightly full run on main. A failing
      # git fails the step.
      - name: Decide on the app image and the upgrade check
        id: upgrade
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            base=$(git rev-parse HEAD~1)
            needed=yes
            image=yes
          else
            base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
            needed=$(.github/ci/upgrade-needed.sh "$base" "$HEAD_SHA")
            image=$(.github/ci/image-needed.sh "$base" "$HEAD_SHA")
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "upgrade check needed: $needed (base $base)"
      - name: Build the app image
        id: build
        if: steps.upgrade.outputs.image == 'yes'
        run: docker build --tag intakt:ci .
      - name: Smoke-test the app image
        if: steps.upgrade.outputs.image == 'yes'
        run: docker/smoke-test.sh intakt:ci
      # Runs after a failed smoke test too, so a run reports both checks of the image, as two workflows did before.
      - name: Start the image on an empty volume and show the seeded panel
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash docker/verify-first-start.sh intakt:ci
      # Runs after a failed smoke test too, for the same reason.
      - name: Start this image on a copy of the base's data, then the base on the original
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.upgrade.outputs.needed == 'yes' }}
        env:
          BASE: ${{ steps.upgrade.outputs.base }}
        run: bash docker/verify-upgrade.sh intakt:ci "$BASE"
  # A failed nightly or on-demand full run on main opens the issue "Nightly CI failed on main" with the run link, or
  # comments the link on the open one (.github/ci/nightly-failed-issue.sh). The only job that may write issues; a pull
  # request or push run skips it, so it never blocks a merge. A cancel by hand makes failure() false.
  nightly-failed:
    needs: [check, journeys, changes, persistence, image]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    # GitHub's image has gh.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/ci/nightly-failed-issue.sh "$RUN_LINK"
