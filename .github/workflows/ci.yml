name: ci
# Every gate on each pull request (on GitHub's test merge of it) and on main; a newer run of the same ref cancels the one it replaces.
# Never pull_request_target: pull-request code must not run with the base repository's secrets or write token.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: ctype, iconv, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Require PHP 8.5.12 or later (fixes PHP2Shell, CVE-2026-109618 and CVE-2026-109619)
        run: |
          php -r 'echo PHP_VERSION, PHP_EOL; exit(version_compare(PHP_VERSION, "8.5.12", ">=") ? 0 : 1);'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Install the locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install the pinned gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          directory="$RUNNER_TEMP/gitleaks-$version"
          mkdir -p "$directory"
          curl -fsSL -o "$directory/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_linux_x64.tar.gz"
          echo "$checksum  $directory/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$directory/gitleaks.tar.gz" -C "$directory" gitleaks
          echo "$directory" >> "$GITHUB_PATH"
      # The gate tests contain processes in a user namespace, which Ubuntu 24.04 restricts for unprivileged users by default.
      # Only for GitHub-hosted runners, which are discarded after the job: never copy this step to a self-hosted runner.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # bin/check runs every gate, the tests on SQLite included. On a pull request the change is read against the
      # target branch, and GitHub's synthetic test merge commit is exempt from the commit-subject gate.
      - name: Run the gates on a pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          MERGE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bin/check --base="origin/$BASE_REF" --test-merge="$MERGE_SHA:$BASE_SHA:$HEAD_SHA"
      - name: Run the gates on main
        if: github.event_name == 'push'
        run: bin/check --base=origin/main
  # The persistence group on each supported engine; bin/check keeps running it on SQLite. The job runs in a container
  # so the database is reached by its service name, and the databases take no password (throwaway, never published).
  persistence:
    name: persistence (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mysql 8.4
            image: mysql:8.4
            scheme: mysql
            port: 3306
            user: root
            extension: pdo_mysql
            health: mysqladmin ping --silent
            open_switch: MYSQL_ALLOW_EMPTY_PASSWORD
            open_value: 'yes'
          - name: mariadb 11.4
            image: mariadb:11.4
            scheme: mysql
            port: 3306
            user: root
            extension: pdo_mysql
            health: healthcheck.sh --connect --innodb_initialized
            open_switch: MARIADB_ALLOW_EMPTY_ROOT_PASSWORD
            open_value: 'yes'
          - name: postgresql 17
            image: postgres:17
            scheme: postgresql
            port: 5432
            user: postgres
            extension: pdo_pgsql
            health: pg_isready --username=postgres
            open_switch: POSTGRES_HOST_AUTH_METHOD
            open_value: trust
    env:
      DATABASE_NAME: intakt_test
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: intakt_test
          MARIADB_DATABASE: intakt_test
          POSTGRES_DB: intakt_test
        options: >-
          --env ${{ matrix.open_switch }}=${{ matrix.open_value }}
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Install git and unzip for the checkout and Composer
        run: apt-get update && apt-get install --yes --no-install-recommends ca-certificates curl git unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: ctype, iconv, pdo_sqlite, sqlite3, ${{ matrix.extension }}
          coverage: none
          tools: composer:v2
      - name: Require PHP 8.5.12 or later (fixes PHP2Shell, CVE-2026-109618 and CVE-2026-109619)
        run: |
          php -r 'echo PHP_VERSION, PHP_EOL; exit(version_compare(PHP_VERSION, "8.5.12", ">=") ? 0 : 1);'
      - name: Install the locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run the persistence group on ${{ matrix.name }}
        env:
          DATABASE_URL: ${{ matrix.scheme }}://${{ matrix.user }}@database:${{ matrix.port }}/${{ env.DATABASE_NAME }}
        run: vendor/bin/phpunit --group persistence
