name: first-start
# A smoke check of the demo's first start on the real image and an empty volume; needs Docker on the runner, no secrets.
# Never pull_request_target: pull-request code must not run with the base repository's secrets or write token.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: first-start-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  first-start:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the image on an empty volume and show the seeded panel
        run: bash docker/verify-first-start.sh
