name: release-image
# Publishes the app image to GitHub's container registry for every release tag (docs/releasing.md). Release tags are
# owner-only (docs/releasing.md#cutting-a-release-by-hand); no pull request runs this workflow, so pull-request code never runs with its write token.
# workflow_dispatch publishes the image of an existing tag (a tag cut before this workflow, or a failed run). The script
# runs from this workflow's revision and builds the tag from its own checkout in release/, so an older tag works too.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, vX.Y.Z
        required: true
        type: string
concurrency:
  group: release-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  image:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          path: release
          persist-credentials: false
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/ci/docker-hub-login.sh
      - name: Build, smoke-test and push the image
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          CONTEXT: release
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: .github/ci/release-image.sh
  latest:
    needs: image
    # One run at a time across all tags; GitHub keeps one waiting and drops older waiting ones, which is harmless:
    # every run points latest at the highest tag as the tags are now, not at its own (.github/ci/release-latest.sh).
    concurrency:
      group: release-image-latest
      cancel-in-progress: false
    # GitHub's image has gh and docker buildx; the job pulls nothing from Docker Hub.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Point latest at the highest release tag
        env:
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: .github/ci/release-latest.sh
