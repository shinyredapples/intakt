name: release-labels
# GitHub groups generated release notes only by pull-request labels (.github/release.yml), so the Conventional Commit
# type of each pull request's title becomes its label. No checkout: no pull-request code runs with the write token.
# Never pull_request_target: a pull request from a fork gets a read-only token and is skipped.
on:
  pull_request:
    types: [opened, reopened, edited]
permissions:
  contents: read
jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.action != 'edited' || github.event.changes.title)
    # On CI_RUNS_ON; with no checkout, a runner without gh gets Ubuntu's own package (any gh version does here).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    # On the job, not the workflow: a skipped edit (no title change) must not cancel a running label job.
    concurrency:
      group: release-labels-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Install gh when the runner lacks it
        run: command -v gh > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gh; }
      - name: Label the pull request with the type of its title
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # Read now, not from the event: a run this one cancelled may have changed the labels since.
          current="$(gh pr view "$NUMBER" --repo "$REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')"
          pattern='^([a-z]+)(\([^)]*\))?!?: '
          type=''
          if [[ "$TITLE" =~ $pattern ]]; then
            type="${BASH_REMATCH[1]}"
          fi
          for label in feat fix docs; do
            if [[ "$label" == "$type" ]]; then
              gh label create "$label" --repo "$REPOSITORY" --force --description "Conventional Commit type $label"
              gh pr edit "$NUMBER" --repo "$REPOSITORY" --add-label "$label"
            elif [[ ",$current," == *",$label,"* ]]; then
              gh pr edit "$NUMBER" --repo "$REPOSITORY" --remove-label "$label"
            fi
          done
