version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    versioning-strategy: increase
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      symfony-ai:
        patterns: ['symfony/ai-*', 'symfony/mcp-bundle', 'mcp/sdk']
      development:
        dependency-type: development
      production:
        dependency-type: production
