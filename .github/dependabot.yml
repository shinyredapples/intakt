version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown] as composer.json's policy.cooldown
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: ['/', '/.github/ci']
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown] as composer.json's policy.cooldown
      semver-major-days: 7
    groups:
      images:
        patterns: ['*']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    versioning-strategy: increase
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown] as composer.json's policy.cooldown
      semver-major-days: 7
    groups:
      symfony-ai:
        patterns: ['symfony/ai-*', 'symfony/mcp-bundle', 'mcp/sdk']
      development:
        dependency-type: development
      production:
        dependency-type: production
