version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: ['/', '/.github/ci']
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown] matches the 3-day composer cooldown in docs/architecture/conventions.md
    groups:
      gitleaks:
        patterns: ['ghcr.io/gitleaks/gitleaks']
      images:
        patterns: ['*']
        exclude-patterns: ['ghcr.io/gitleaks/gitleaks']
  - package-ecosystem: npm
    directory: /docker/job/cli
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown] matches the 3-day composer cooldown in docs/architecture/conventions.md
    groups:
      # one group, so one update round rebuilds the job image once
      job-image-cli:
        patterns: ['*']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    versioning-strategy: increase
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown] matches the 3-day composer cooldown in docs/architecture/conventions.md
      semver-major-days: 7
    groups:
      symfony-ai:
        patterns: ['symfony/ai-*', 'symfony/mcp-bundle', 'mcp/sdk']
      development:
        dependency-type: development
      production:
        dependency-type: production
    ignore:
      # rector 2.8.4 deletes a conditional assignment that has side effects under the configured sets (review of #1285,
      # 2026-11-11): skip that release only, so the next one is reviewed again
      - dependency-name: rector/rector
        versions: ['2.8.4']
