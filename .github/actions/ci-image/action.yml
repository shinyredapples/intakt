name: CI image
description: >-
  Makes the CI image available as CI_IMAGE: reuses one already on the runner, else loads the copy a run on main cached
  for the same inputs, else builds it through Buildx with a layer cache that only runs on main write (after a failed
  Docker Hub login it fails instead of building); a run on main caches a newly built image for later runs. Pull requests
  never save.
runs:
  using: composite
  steps:
    # The cache key is the hash that names the image (.github/ci/build-image.sh), so a cached image is reused only for
    # exactly the inputs it was built from.
    - id: name
      shell: bash
      run: |
        set -eu
        hash=$(.github/ci/build-image.sh --print-hash)
        echo "key=intakt-ci-image-$hash" >> "$GITHUB_OUTPUT"
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
        if docker image inspect "intakt-ci:$hash" > /dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
    - id: restore
      if: steps.name.outputs.present != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/intakt-ci-image.tar
        key: ${{ steps.name.outputs.key }}
    # A build reuses whatever matching layers main's runs left in the build action's layer cache (fixed scope
    # intakt-ci-image); an empty or evicted cache builds in full. Only a run on main writes it, best effort. The build gets
    # no secret, token or build argument, so none reaches a cached layer, and the builder image is pinned by tag and digest
    # (bumped by hand: Dependabot does not read driver-opts). build-image.sh then finds the image and reuses it. After a
    # failed Docker Hub login nothing is built here, so the next step fails as before.
    - id: buildx
      if: >-
        steps.name.outputs.present != 'true' && steps.restore.outputs.cache-hit != 'true' && env.DOCKERHUB_LOGIN_FAILED != '1'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
    - id: build
      if: steps.buildx.outcome == 'success'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
        DOCKER_BUILD_SUMMARY: 'false'
      with:
        context: .
        file: .github/ci/Dockerfile
        tags: intakt-ci:${{ steps.name.outputs.hash }}
        load: true
        push: false
        cache-from: type=gha,scope=intakt-ci-image
        cache-to: >-
          ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
          && 'type=gha,scope=intakt-ci-image,mode=max,ignore-error=true' || '' }}
    # After a failed Docker Hub login the image must be on the runner already or come from the cache tar with its expected
    # tag; a tar that loads without that tag would otherwise lead to a pull or a build, so the step fails instead.
    - shell: bash
      env:
        KEY: ${{ steps.name.outputs.key }}
      run: |
        set -eu
        if [ -f "$RUNNER_TEMP/intakt-ci-image.tar" ]; then
          docker load --input "$RUNNER_TEMP/intakt-ci-image.tar"
          rm -f "$RUNNER_TEMP/intakt-ci-image.tar"
        fi
        if [ "${DOCKERHUB_LOGIN_FAILED:-}" = 1 ] && ! docker image inspect "intakt-ci:${KEY#intakt-ci-image-}" > /dev/null 2>&1; then
          echo "::error::The Docker Hub login failed and the CI image is neither on the runner nor in the cache, so it would have to be pulled or built."
          exit 1
        fi
        .github/ci/build-image.sh
    # Only a run on main saves (a push, the nightly journeys or a manual run), never a pull request: a pull request runs
    # its own workflow, so a save there could plant an image that a later job would run. GitHub also keeps a pull
    # request's saves out of main's scope; this keeps pull requests from saving at all.
    - id: export
      if: >-
        github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        && steps.name.outputs.present != 'true' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: docker save --output "$RUNNER_TEMP/intakt-ci-image.tar" "$CI_IMAGE"
    - if: steps.export.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/intakt-ci-image.tar
        key: ${{ steps.name.outputs.key }}
