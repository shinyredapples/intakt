framework:
    messenger:
        default_bus: command.bus
        failure_transport: failed
        buses:
            # A caller gets the failing handler's own exception, so a refusal such as RoundNotNext is caught by its type; a worker still gets the HandlerFailedException.
            # Each bus accepts only its own marker, so a query sent on the command bus is refused at dispatch instead of looking for a handler.
            command.bus:
                messages: Intakt\Core\Platform\Contract\CommandMessage
                unwrap_exceptions: true
            query.bus:
                messages: Intakt\Core\Platform\Contract\QueryMessage
        transports:
            # One worker per reviewer message runs the reviewers of a round in parallel. The table comes from the migrations, never from a first send, because a first send inside a rolled-back transaction would take the table with it.
            # redeliver_timeout stays above RoundReviewer::REVIEW_CEILING (one hour), so a message handed out again finds its reviewer's hold ended.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: false
                    redeliver_timeout: 5400
                # max_retries counts only for exceptions that are not recoverable; a recoverable one (a held or rate-limited reviewer, a limited judge call, an escalation review call on a busy account or rate limited) always comes back, after the delay it names.
                # An escalation review call the provider failed transiently is the one bounded recoverable failure: BoundTransientEscalationFailures counts it in its own stamp and gives it these max_retries and delays, however many forced retries came before, then parks it.
                # max_delay caps the wait of a recoverable one that names no delay (a busy account, a limit without a reset), because it never runs out of retries and the doubling would otherwise stall a round for days.
                retry_strategy:
                    max_retries: 2
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
            # Shares the queue table, told apart by queue_name, so it needs no table of its own.
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: false
                    queue_name: failed
        routing:
            Intakt\Core\Review\UseCase\RunReviewRound\ReviewWithReviewer: async
            Intakt\Core\Review\UseCase\JudgeRound\JudgeRound: async
            Intakt\Core\Review\UseCase\IndexResolvedFindings\IndexResolvedFindings: async
            # Queued, so the embedding call of a settled finding runs in a worker and never holds up the judging or the escalation.
            Intakt\Core\Review\UseCase\SettleRejectedFindings\SettleRejectedFinding: async
            Intakt\Core\Review\UseCase\PublishVerdict\PublishVerdict: async
            Intakt\Core\Review\Contract\RoundOpened: async
            # Queued in the judging's transaction on the Doctrine queue, so it commits with the recurrence and its strong-tier call runs outside the judging's locks.
            Intakt\Core\Review\UseCase\EscalateRecurringP1\EscalateRecurringP1: async
            # Dispatched by the failure stamp of a parked escalation; queued, so a record that finds the key's lock held comes back instead of being lost.
            Intakt\Core\Review\UseCase\EscalateRecurringP1\RecordFailedEscalation: async
            # Queued in the watch tick's transaction, so the worker's lookup of the judged round runs only after the hand-over line has committed.
            Intakt\Core\Review\Contract\PublishHandedOverChange: async
            # A replay sleeps at the recorded pace for minutes, so it runs in a queue worker and never in a web worker.
            Intakt\Core\Dashboard\UseCase\PlayDemo\PlayDemoRun: async
