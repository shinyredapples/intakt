parameters:
    # Spelled once, for the reviewers' configured connection below and for the subscription CLI's configuration; YAML cannot put a constant inside the reference below.
    !php/const Intakt\Core\Review\Contract\ReviewServices::MCP_URL: '%env(REVIEW_MCP_BASE_URL)%/mcp/review'

mcp:
    servers:
        owner:
            name: intakt
            description: Intakt, for the agents of the owner
            http:
                path: /mcp/owner
            session:
                store: file
                # Concurrent calls of one session wait for each other, so none overwrites what another saved.
                lock: true
            # Listed by namespace, because a prefix of all Intakt would also serve the repository tools of the review server.
            registry:
                tools: ['Intakt\Core\Ai\UseCase\ListProjects\', 'Intakt\Core\Review\UseCase\ReadRound\', 'Intakt\Plugin\LocalGitForge\UseCase\ReviewChange\']
                resource_templates: ['Intakt\Core\Review\UseCase\ReadRound\']
        review:
            name: intakt-review
            description: The read-only tools of the repository at the head under review
            http:
                path: /mcp/review
            session:
                store: file
                lock: true
            registry:
                tools: ['Intakt\Core\Review\UseCase\ServeReviewTools\']
    # The reviewers' connection to the review server above, used by the mcp_server tool entry of the reviewer agent in ai.php.
    clients:
        reviewer:
            client_info:
                name: intakt-reviewer
            servers:
                review:
                    transport: http
                    url: '%intakt.review.mcp_url%'
                    # Adds the bearer credential of the round under review to every request, because headers here are fixed.
                    http_client: Intakt\Core\Review\Infrastructure\ReviewServerHttpClient
