framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null
        pools:
            # On this host's filesystem, so every worker sees an account's or a pinned provider's cooldown; a cleared cache ends the cooldowns, and the next limit starts them again.
            !php/const Intakt\Core\Ai\Contract\AiServices::ACCOUNT_COOLDOWNS:
                adapter: cache.app
            # On this host's filesystem, so every worker and the scheduler read one installation's latest forge budget; a cleared cache only forgets a reading, and the next answer records it again.
            !php/const Intakt\Plugin\GitHubForge\Contract\GitHubForgeServices::RATE_LIMITS:
                adapter: cache.app
            # On this host's filesystem, so every worker knows the board last pushed on the shell topic; a cleared cache only pushes an unchanged board once more.
            !php/const Intakt\Core\Dashboard\Contract\DashboardServices::BOARD_HEADLINES:
                adapter: cache.app

when@test:
    framework:
        cache:
            pools:
                # In memory, so no cooldown outlives the test that started it.
                !php/const Intakt\Core\Ai\Contract\AiServices::ACCOUNT_COOLDOWNS:
                    adapter: cache.adapter.array
                # In memory, so no reading outlives the test that recorded it.
                !php/const Intakt\Plugin\GitHubForge\Contract\GitHubForgeServices::RATE_LIMITS:
                    adapter: cache.adapter.array
                # In memory, so no pushed board outlives the test that pushed it.
                !php/const Intakt\Core\Dashboard\Contract\DashboardServices::BOARD_HEADLINES:
                    adapter: cache.adapter.array
