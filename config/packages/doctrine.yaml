doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '%env(postgresql_server_version:resolve:DATABASE_URL)%'

        # The Agent message store owns the first table and keeps it in step; the Messenger transport owns the second. The migrations only create them.
        schema_filter: '~^(?!reviewer_conversation$|messenger_messages$)~'
        profiling_collect_backtrace: '%kernel.debug%'
        types:
            utc_datetime_immutable: Intakt\Core\Ledger\Infrastructure\UtcDateTimeImmutableType
    orm:
        validate_xml_mapping: true
        use_schema_editor_api: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            BranchCleanup:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Core/BranchCleanup/Domain'
                prefix: 'Intakt\Core\BranchCleanup\Domain'
                alias: BranchCleanup
            Build:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Core/Build/Domain'
                prefix: 'Intakt\Core\Build\Domain'
                alias: Build
            Budget:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Core/Budget/Domain'
                prefix: 'Intakt\Core\Budget\Domain'
                alias: Budget
            Ledger:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Core/Ledger/Domain'
                prefix: 'Intakt\Core\Ledger\Domain'
                alias: Ledger
            Review:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Core/Review/Domain'
                prefix: 'Intakt\Core\Review\Domain'
                alias: Review
            GitHubWorkSource:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Plugin/GitHubWorkSource/Domain'
                prefix: 'Intakt\Plugin\GitHubWorkSource\Domain'
                alias: GitHubWorkSource
            Watcher:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Core/Watcher/Domain'
                prefix: 'Intakt\Core\Watcher\Domain'
                alias: Watcher

when@dev:
    doctrine:
        dbal:
            # Also with APP_DEBUG=0, whose default leaves the db collector of a saved profile without its queries.
            profiling: true

when@test:
    doctrine:
        dbal:
            # Also with APP_DEBUG=0, whose default leaves the db collector of an opted-in test profile without its queries.
            profiling: true
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
