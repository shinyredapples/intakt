# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Every uncaught exception answers inside the dashboard's shell, with a way back to the board.
    error_controller: Intakt\Core\Dashboard\UseCase\ShowError\ShowErrorController

    # Stored verdicts and findings (de)serialize through this one serializer; the snake_case converter keeps the stored keys when a property is camelCase.
    serializer:
        named_serializers:
            stored:
                name_converter: serializer.name_converter.camel_case_to_snake_case

    #esi: true
    #fragments: true

    # Reads and review posts of the GitHub API; retry_failed wraps the client in RetryableHttpClient, so a failed read is tried again (the review post turns it off for itself).
    # The http_codes are Symfony's defaults without 429, because the forge raises a 429 as a rate limit and waits for the reset it names; 0 is a dropped connection.
    # Its base_uri is set in github_forge.php, from the parameter the connectivity check probes too.
    http_client:
        scoped_clients:
            github.client:
                headers:
                    X-GitHub-Api-Version: '2022-11-28'
                retry_failed:
                    max_retries: 3
                    http_codes:
                        0: [GET, HEAD, PUT, DELETE, OPTIONS, TRACE]
                        423: true
                        425: true
                        500: [GET, HEAD, PUT, DELETE, OPTIONS, TRACE]
                        502: true
                        503: true
                        504: [GET, HEAD, PUT, DELETE, OPTIONS, TRACE]
                        507: [GET, HEAD, PUT, DELETE, OPTIONS, TRACE]
                        510: [GET, HEAD, PUT, DELETE, OPTIONS, TRACE]

# Profiles let a change be measured on a running install; prod and the image define no profiler, and ProfileOnlyRequestMeasuresPass keeps only the collectors that measure a request; PathOnlyProfilerStorage drops the query string and client address of what it saves.
when@dev:
    framework:
        profiler:
            collect: true

when@test:
    framework:
        test: true
        # Collects only for a test that calls the client's enableProfiler(), so the suite does not pay for profiles it never reads.
        profiler:
            collect: false
