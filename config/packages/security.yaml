security:
    # MCP tools are authorized by a voter on Intakt's own config (ToolAccessVoter); the firewalls read bearer tokens, the owner's and a review round's.
    firewalls:
        mcp_owner:
            pattern: ^/mcp/owner
            stateless: true
            # Without access_control, a call with no header still reaches the read tools; only a write needs the token.
            access_token:
                token_handler:
                    id: Intakt\Core\Mcp\Infrastructure\OwnerTokenHandler
        mcp_review:
            pattern: ^/mcp/review
            stateless: true
            access_token:
                token_handler:
                    id: Intakt\Core\Review\UseCase\ServeReviewTools\ReviewCredential
        main:
            security: false

    # The review server answers only with a credential, because the credential, not the call, names the round whose head it shows.
    access_control:
        - { path: ^/mcp/review, roles: ROLE_MCP_REVIEWER }
