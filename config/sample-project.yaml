# The sample project's provider facts in one place, so refreshing the five-minute start is an edit of this file.
# Read by src/Core/Review/Contract/SampleProjectData.php (the seed, the Hugging Face key check's router and the key check's model on a fresh install) and by docker/entrypoint.sh,
# which reads router_url line by line with bash alone, so it must stay one top-level line with an unquoted value and no trailing comment.

# Without /v1, because the generic bridge appends /v1/chat/completions itself.
router_url: https://router.huggingface.co

# The date of the price table below, written into the seeded file as budget.price_date.
price_date: '2026-11-13'

# The router models name their router provider, because the router's default provider may refuse tools together with structured output.
models:
    anthropic: { strong: claude-opus-5-5, standard: claude-sonnet-5-5, light: claude-haiku-5-5 }
    openai: { strong: gpt-6.2-sol, standard: gpt-6.1-terra, light: gpt-6-luna }
    openai_compatible: { strong: 'moonshotai/Kimi-K3.1-Pro:deepinfra', standard: 'moonshotai/Kimi-K3.1-Pro:deepinfra', light: 'moonshotai/Kimi-K3.1-Pro:deepinfra' }

# Another AI lab's model for the second reviewer when the router carries the whole panel, so the panel still has two AI labs.
second_lab: 'deepseek-ai/DeepSeek-V4-Pro-0813:deepinfra'

# List prices in US dollars per million tokens, so the demo's first review shows a cost; the owner can change them in the seeded file.
prices:
    claude-opus-5-5: { input: 5, output: 25, cache_read: 0.5, cache_write: 6.25 }
    claude-sonnet-5-5: { input: 3, output: 15, cache_read: 0.3, cache_write: 3.75 }
    claude-haiku-5-5: { input: 1, output: 5, cache_read: 0.1, cache_write: 1.25 }
    gpt-6.2-sol: { input: 2, output: 10 }
    gpt-6.1-terra: { input: 1, output: 5 }
    gpt-6-luna: { input: 0.1, output: 0.5 }
    'moonshotai/Kimi-K3.1-Pro:deepinfra': { input: 1.9, output: 9.5 }
    'deepseek-ai/DeepSeek-V4-Pro-0813:deepinfra': { input: 1.3, output: 2.6 }
