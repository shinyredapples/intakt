# The sample project's provider facts in one place, so refreshing the five-minute start is an edit of this file.
# Read by src/Core/Review/Contract/SampleProjectData.php (the seed and the Hugging Face key check) and by docker/entrypoint.sh,
# which reads router_url line by line with bash alone, so it must stay one plain top-level line.

# Without /v1, because the generic bridge appends /v1/chat/completions itself.
router_url: https://router.huggingface.co

# The day the prices below were read, written into the seeded file as budget.price_date.
price_date: '2026-11-13'

# The router models name their router provider, because the router's default provider may refuse tools together with structured output.
models:
    anthropic: { strong: claude-opus-5-5, standard: claude-sonnet-5-5, light: claude-haiku-5-5 }
    openai: { strong: gpt-5, standard: gpt-5-mini, light: gpt-5-nano }
    openai_compatible: { strong: 'moonshotai/Kimi-K3:deepinfra', standard: 'moonshotai/Kimi-K3:deepinfra', light: 'moonshotai/Kimi-K3:deepinfra' }

# Another maker's model for the second reviewer when the router carries the whole panel, so the panel still has two makers.
second_maker: 'openai/gpt-oss-120b:novita'

# List prices in US dollars per million tokens, so the demo's first review shows a cost; the owner can change them in the seeded file.
prices:
    claude-opus-5-5: { input: 5, output: 25, cache_read: 0.5, cache_write: 6.25 }
    claude-sonnet-5-5: { input: 3, output: 15, cache_read: 0.3, cache_write: 3.75 }
    claude-haiku-5-5: { input: 1, output: 5, cache_read: 0.1, cache_write: 1.25 }
    gpt-5: { input: 1.25, output: 10, cache_read: 0.125 }
    gpt-5-mini: { input: 0.25, output: 2, cache_read: 0.025 }
    gpt-5-nano: { input: 0.05, output: 0.4, cache_read: 0.005 }
    'moonshotai/Kimi-K3:deepinfra': { input: 0.6, output: 2.5 }
    'openai/gpt-oss-120b:novita': { input: 0.15, output: 0.6 }
