# Copy to config/intakt.yaml (git-ignored) and run `php bin/console cache:clear`.
# Optional accounts per provider, tried in this order; "default" reads the provider's own variables (ANTHROPIC_API_KEY),
# any other name reads them with its name appended (ANTHROPIC_API_KEY_TEAM). A provider not listed has its default account only.
accounts:
    anthropic: [default, team]
# Optional: no call starts on an account while a window's measured use is at its ceiling, in percent from 1 to 100 (default 90 each).
budget:
    ceilings:
        five-hour: 90
        weekly: 90
    # Optional: shadow rounds start only below these lower ceilings (default 70 each), so they leave capacity to the existing loop.
    shadow_ceilings:
        five-hour: 70
        weekly: 70
    # Optional: the price of each model, keyed by the model name exactly as a tier (or substitute) names it, never the name a provider's answer reports, in US dollars per million tokens, for the cost line of a review.
    # input and output are required; cache_read and cache_write default to input. A round that used a model without a price shows its cost as unknown.
    prices:
        claude-opus-5-5: { input: 5, output: 25, cache_read: 0.5, cache_write: 6.25 }
        claude-haiku-5-5: { input: 1, output: 5, cache_read: 0.1, cache_write: 1.25 }
# Optional: the model and reasoning effort (minimal, low, medium, high or xhigh) every call on a Codex subscription login uses.
# A tier on provider codex must name this model: { provider: codex, model: gpt-5.3-codex }.
codex: { model: gpt-5.3-codex, effort: high }
# Each project maps the capability tiers to a provider (anthropic, openai, openai_compatible, claude_code, codex) and a model name.
projects:
    alpha:
        tiers:
            # A tier may also set max_output, the most one answer may have, as a whole number (defaults: strong 16000, standard 8000, light 4000); a reviewer stopped at it runs once more with twice the room.
            strong: { provider: anthropic, model: claude-opus-5-5 }
            # A tier may list substitutes, in order, for when every account of its provider is out (a review then runs on the first one that can answer):
            # standard: { provider: anthropic, model: claude-sonnet-5-5, substitutes: [{ provider: openai, model: gpt-5-mini }] }
            standard: { provider: anthropic, model: claude-sonnet-5-5 }
            light: { provider: anthropic, model: claude-haiku-5-5 }
        # An optional review section sets the panel: quorum is all, majority or one-strong-plus-one;
        # each reviewer needs a role, a tier, a provider (the one the project maps that tier to), a prompt and a budget (a whole number of at least 1).
        review:
            quorum: majority
            reviewers:
                - { role: correctness, tier: strong, provider: anthropic, prompt: Check that the change does what the task asks., budget: 10 }
                - { role: maintainability, tier: standard, provider: anthropic, prompt: Check that the code reads clearly., budget: 6 }
            # Optional rules add reviewers to a change with at least min_lines changed lines or a path matching one of paths
            # ("*" stays in one folder, "**" crosses folders, "/**/" also matches none); the label review:full applies every rule.
            rules:
                - paths: [config/**, src/**/Security/**]
                  reviewers:
                      - { role: security, tier: strong, provider: anthropic, prompt: Look for ways the change weakens a check., budget: 8 }
        # An optional watch section makes the Scheduler tick read the project's open pull requests and start a round for each head whose CI is green;
        # the task text is given to every round until the pull request text is read from the forge.
        # `repository` is the local clone a round reads from; `github` is the same project on GitHub, where its open pull requests and their CI are read.
        watch: { repository: /path/to/alpha, base: main, task: Review the pull request., github: acme/alpha }
    beta:
        # Optional: shadow never writes to the forge and its verdicts never count; reviewer-for-loop reviews the existing loop's heads,
        # its verdicts count and it only publishes its verdict on each head (a commit status and a comment); live, the default, writes.
        mode: shadow
        tiers:
            strong: { provider: openai, model: gpt-5 }
            standard: { provider: openai, model: gpt-5-mini }
            light: { provider: openai_compatible, model: local-small }
