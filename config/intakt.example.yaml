# Copy to config/intakt.yaml (git-ignored) and run `php bin/console cache:clear`.
# Optional accounts per provider, tried in this order; "default" reads the provider's own variables (ANTHROPIC_API_KEY),
# any other name reads them with its name appended (ANTHROPIC_API_KEY_TEAM). A provider not listed has its default account only.
accounts:
    anthropic: [default, team]
# Optional: no call starts on an account while a window's measured use is at its ceiling, in percent from 1 to 100 (default 90 each).
budget:
    ceilings:
        five-hour: 90
        weekly: 90
    # Optional: the price of each model, keyed by the model name exactly as a tier (or substitute) names it, never the name a provider's answer reports, in US dollars per million tokens, for the cost line of a review.
    # input and output are required; cache_read and cache_write default to input. A round that used a model without a price shows its cost as unknown.
    # Optional: the day you read the prices (YYYY-MM-DD, in quotes: YAML would turn an unquoted date into a timestamp); the review shows it beside the estimated cost, and says the price date is unknown without it.
    # The shipped date is the earliest day any price in the table below was read; prices read on a later day carry the earlier date.
    price_date: '2026-11-13'
    prices:
        claude-opus-5-5: { input: 5, output: 25, cache_read: 0.5, cache_write: 6.25 }
        claude-haiku-5-5: { input: 1, output: 5, cache_read: 0.1, cache_write: 1.25 }
        claude-sonnet-5-5: { input: 3, output: 15, cache_read: 0.3, cache_write: 3.75 }
        gpt-6.2-sol: { input: 2, output: 10 }
        gpt-6.1-terra: { input: 1, output: 5 }
        gpt-6-luna: { input: 0.1, output: 0.5 }
# Optional: the share of the GitHub installation's hourly allowance kept for the calls Intakt cannot do without, a whole number from 0 (no reserve) to 100 (default 20);
# while less is left, each project's open pull requests are listed once a minute on average.
github:
    reserve_percent: 20
# Optional: the model and reasoning effort (minimal, low, medium, high or xhigh) every call on a Codex subscription login uses.
# A tier on provider codex must name this model: { provider: codex, model: gpt-6.2-sol }.
codex: { model: gpt-6.2-sol, effort: high }
# Each project maps the capability tiers to a provider (anthropic, openai, openai_compatible, claude_code, codex) and a model name.
projects:
    alpha:
        tiers:
            # A tier may also set max_output, the most one answer may have, as a whole number (defaults: strong 16000, standard 8000, light 4000); a reviewer stopped at it runs once more with twice the room.
            strong: { provider: anthropic, model: claude-opus-5-5 }
            # A tier may list substitutes, in order, for when every account of its provider is out (a review then runs on the first one that can answer), except that a free fallback of the same model on the tier's own provider (the same name before the colon, another pinned router provider after it) is tried before every other substitute:
            # standard: { provider: anthropic, model: claude-sonnet-5-5, substitutes: [{ provider: openai, model: gpt-6.1-terra }] }
            standard: { provider: anthropic, model: claude-sonnet-5-5 }
            light: { provider: anthropic, model: claude-haiku-5-5 }
        # An optional review section sets the panel: quorum is all, majority or one-strong-plus-one;
        # each reviewer needs a role, a tier, a provider (the one the project maps that tier to), a prompt and a budget (a whole number of at least 1).
        review:
            quorum: majority
            reviewers:
                - { role: correctness, tier: strong, provider: anthropic, prompt: Check that the change does what the task asks., budget: 10 }
                - { role: maintainability, tier: standard, provider: anthropic, prompt: Check that the code reads clearly., budget: 6 }
            # Optional rules add reviewers to a change with at least min_lines changed lines or a path matching one of paths
            # ("*" stays in one folder, "**" crosses folders, "/**/" also matches none); the label review:full applies every rule.
            rules:
                - paths: [config/**, src/**/Security/**]
                  reviewers:
                      - { role: security, tier: strong, provider: anthropic, prompt: Look for ways the change weakens a check., budget: 8 }
        # An optional build section routes the tier a build starts on: tier (strong, standard or light; standard by default) for an ordinary build;
        # a build touching a sensitive path starts strong whatever its label says, else a model:<tier> label sets the tier;
        # escalate_on lists the setbacks (failed-attempt, blocking-finding, stall) that raise the next build to strong (all three by default).
        build:
            tier: standard
            sensitive_paths: [config/**, src/**/Security/**]
            escalate_on: [failed-attempt, blocking-finding, stall]
        # An optional watch section makes the Scheduler tick read the project's open pull requests and start a round for each head whose CI is green;
        # the task text is given to every round until the pull request text is read from the forge.
        # `repository` is the local clone a round reads from; `github` is the same project on GitHub, where its open pull requests and their CI are read.
        # `eligibility_label` (optional, `intakt` when left out, read by the work source that chooses the next task; `php bin/console intakt:queue:show <project>` prints the order it picks in) is the issue label that lets Intakt build a task; it must not be blank.
        watch: { repository: /path/to/alpha, base: main, task: Review the pull request., github: acme/alpha, eligibility_label: intakt }
        # Optional: the files and folders (everything below one counts) a change may only touch with an approval, from the repository's root;
        # .gitmodules and submodules always count. `php bin/console intakt:protected:list alpha <head>` lists what a head touches.
        protected_paths: [bin/check, config/gates/, .github, AGENTS.md]
        # Optional: the image a review job of this project runs in, as `intakt:job:build-image --kind=review` tagged it; no review uses review jobs yet.
        review_job: { image: intakt-job/alpha:review }
    beta:
        # Optional: reviewer-for-loop reviews the heads of a build loop such as the one that developed Intakt, its verdicts count and it only publishes its verdict on each head
        # (a commit status and a comment); live is the default.
        mode: reviewer-for-loop
        tiers:
            strong: { provider: openai, model: gpt-6.2-sol }
            standard: { provider: openai, model: gpt-6.1-terra }
            light: { provider: openai, model: gpt-6-luna }
