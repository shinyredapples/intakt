# Copy to config/intakt.yaml (git-ignored) and run `php bin/console cache:clear`.
# Optional accounts per provider, tried in this order; "default" reads the provider's own variables (ANTHROPIC_API_KEY),
# any other name reads them with its name appended (ANTHROPIC_API_KEY_TEAM). A provider not listed has its default account only.
accounts:
    anthropic: [default, team]
# Each project maps the capability tiers to a provider (anthropic, openai, openai_compatible) and a model name.
projects:
    alpha:
        tiers:
            strong: { provider: anthropic, model: claude-opus-5-5 }
            # A tier may list substitutes, in order, for when every account of its provider is out (a review then runs on the first one that can answer):
            # standard: { provider: anthropic, model: claude-sonnet-5-5, substitutes: [{ provider: openai, model: gpt-5-mini }] }
            standard: { provider: anthropic, model: claude-sonnet-5-5 }
            light: { provider: anthropic, model: claude-haiku-5-5 }
        # An optional review section sets the panel: quorum is all, majority or one-strong-plus-one;
        # each reviewer needs a role, a tier, a provider (the one the project maps that tier to), a prompt and a budget (a whole number of at least 1).
        review:
            quorum: majority
            reviewers:
                - { role: correctness, tier: strong, provider: anthropic, prompt: Check that the change does what the task asks., budget: 10 }
                - { role: maintainability, tier: standard, provider: anthropic, prompt: Check that the code reads clearly., budget: 6 }
            # Optional rules add reviewers to a change with at least min_lines changed lines or a path matching one of paths
            # ("*" stays in one folder, "**" crosses folders, "/**/" also matches none); the label review:full applies every rule.
            rules:
                - paths: [config/**, src/**/Security/**]
                  reviewers:
                      - { role: security, tier: strong, provider: anthropic, prompt: Look for ways the change weakens a check., budget: 8 }
        # An optional watch section makes the Scheduler tick read the project's open pull requests and start a round for each head whose CI is green;
        # the task text is given to every round until the pull request text is read from the forge.
        watch: { repository: /path/to/alpha, base: main, task: Review the pull request. }
    beta:
        # Optional: shadow never writes to the forge; live, the default, does.
        mode: shadow
        tiers:
            strong: { provider: openai, model: gpt-5 }
            standard: { provider: openai, model: gpt-5-mini }
            light: { provider: openai_compatible, model: local-small }
