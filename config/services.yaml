# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    !php/const Intakt\Plugin\SymfonyAiVendor\Contract\SymfonyAiVendorServices::ACCOUNT_PARALLEL_CALLS: 3
    # The scanner when INTAKT_GITLEAKS is unset or empty, as for the secrets gates.
    !php/const Intakt\Core\Platform\Contract\PlatformServices::GITLEAKS: gitleaks
    # The GitHub API the forge's scoped client calls; the connectivity check probes the same host.
    !php/const Intakt\Plugin\GitHubForge\Contract\GitHubForgeServices::API_URL: 'https://api.github.com'
    # Seconds each HTTPS probe of the connectivity check waits, so an offline check ends in a few seconds per host.
    !php/const Intakt\Core\Outage\Contract\OutageServices::PROBE_TIMEOUT: 3.0
    # The engine's own socket, because the orchestrator runs Docker inside its container and so shares the paths it mounts.
    !php/const Intakt\Core\Job\Contract\JobServices::DOCKER_SOCKET: /var/run/docker.sock
    # Built from docker/egress-proxy on the engine's host, because it is the per-job proxy every job with an allowlist goes through.
    !php/const Intakt\Core\Job\Contract\JobServices::EGRESS_PROXY_IMAGE: intakt-egress-proxy
    # The build slots that run at once on this host (at least 1); with more than one slot, max(2, processors / slots), at most 8, is a ceiling for the gates each builder's bin/check runs at once, handed over only when it is below what bin/check picks from the job's limits, which today's limits never allow (docs/reference/user-manual.md#running-a-build).
    !php/const Intakt\Core\Build\Contract\BuildServices::SLOTS: 1
    # The seconds one tool call of the builder's session may run (at least 1, below the session's 3000-second allowance), above the slowest bin/check --fast, because checks of 7 to 9 minutes on a shared host ran past the CLI's 10-minute default and went to the background (docs/reference/user-manual.md#running-a-build).
    !php/const Intakt\Core\Build\Contract\BuildServices::TOOL_TIME_LIMIT: 1500
    # The limits that end a build over its allowance (docs/reference/user-manual.md#the-build-limits); literal whole numbers of at least 1, the ceiling not below the allowance, checked when the container is built. Starting points to tune from recorded stop causes, because no sizing sets them yet.
    !php/const Intakt\Core\Build\Contract\BuildServices::ALLOWANCE_TOKENS: 5000000
    !php/const Intakt\Core\Build\Contract\BuildServices::IDLE_SECONDS: 600
    !php/const Intakt\Core\Build\Contract\BuildServices::CEILING_TOKENS: 20000000
    !php/const Intakt\Core\Build\Contract\BuildServices::TASK_TOTAL_TOKENS: 50000000
    # Trusted dependency installs live here, written only by the orchestrator's own process and never mounted into a build job (docs/architecture/check-job.md#the-dependency-snapshot-store).
    !php/const Intakt\Core\HandBack\Contract\HandBackServices::DEPENDENCY_SNAPSHOTS_DIRECTORY: '%kernel.project_dir%/var/dependency-snapshots'
    # The snapshots the store keeps (at least 1); the least recently used one past the count is evicted unless a check holds it.
    !php/const Intakt\Core\HandBack\Contract\HandBackServices::DEPENDENCY_SNAPSHOT_COUNT: 10
    # One bare mirror per project lives here, rebuilt from the remote if lost.
    !php/const Intakt\Core\Git\Contract\GitServices::MIRRORS_DIRECTORY: '%kernel.project_dir%/var/mirrors'
    # Deleted branch heads are kept here, under var/data because that is where the image keeps its volume: unlike the mirrors, the archive survives a container replacement.
    !php/const Intakt\Core\Git\Contract\GitServices::BRANCH_ARCHIVE_DIRECTORY: '%kernel.project_dir%/var/data/branch-archive'
    # The orchestrator's own private key, under var/data because that is where the image keeps its volume; it is never mounted into a job.
    !php/const Intakt\Core\Git\Contract\GitServices::SIGNING_KEY: '%kernel.project_dir%/var/data/keys/signing_key'
    # The port the Caddyfile listens on when SERVER_PORT is unset, so the doctor's web server check asks where the server is.
    env(SERVER_PORT): '7781'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Intakt\:
        resource: '../src/'
        exclude:
            # Built per review with the checkout under review, so the container cannot wire them.
            - '../src/Core/Review/Infrastructure/Repository/'
            # Defined in config/packages/ai.php beside the parameters they read, because the scan runs later and would replace those definitions.
            - '../src/Core/Budget/Domain/CeilingStartGuard.php'
            - '../src/Core/Ai/UseCase/ProbeCodexLogin/ProbeCodexLoginCommand.php'
            - '../src/Core/Watcher/Contract/EligibilityLabels.php'

    # Wired here, because a Domain class carries no container attributes; its ceiling guard is wired in config/packages/ai.php.
    Intakt\Core\Budget\Contract\StartGuard: '@Intakt\Core\Budget\Domain\BudgetGuard'

    # Semaphores over file locks, because every worker runs on this host; Symfony's other semaphore store needs Redis.
    Symfony\Component\Lock\Store\FlockStore:
        arguments: ['%kernel.project_dir%/var/locks']
    Symfony\Component\Lock\LockFactory:
        arguments: ['@Symfony\Component\Lock\Store\FlockStore']
    Symfony\Component\Semaphore\Store\LockStore: ~
    Symfony\Component\Semaphore\SemaphoreFactory:
        arguments: ['@Symfony\Component\Semaphore\Store\LockStore']

    # Built by the host's processor count when first needed, because the cached container may come from another machine.
    Intakt\Core\Build\Domain\GatesAtOnce:
        factory: ['@Intakt\Core\Build\Infrastructure\HostProcessors', 'gatesAtOnce']

    # Wired here, because a Domain class carries no container attributes; CheckBuildLimitsPass refuses a bad value before this runs.
    Intakt\Core\Build\Domain\BuildLimits:
        arguments:
            - '%intakt.build.allowance_tokens%'
            - '%intakt.build.idle_seconds%'
            - '%intakt.build.ceiling_tokens%'
            - '%intakt.build.task_total_tokens%'

    # Only the App's identity, because Intakt acts as itself, never with the owner's token (docs/guide/setting-up-intakt.md).
    Intakt\Plugin\GitHubForge\Infrastructure\AppJwt:
        arguments:
            $appId: '%env(GITHUB_APP_ID)%'
            $privateKey: '%env(GITHUB_APP_PRIVATE_KEY)%'
    Intakt\Plugin\GitHubForge\Infrastructure\PostedComments:
        arguments:
            $appId: '%env(GITHUB_APP_ID)%'
    Intakt\Plugin\GitHubForge\Infrastructure\InstallationTokens:
        arguments:
            $installationId: '%env(GITHUB_APP_INSTALLATION_ID)%'
    # Measures the forge check's deadline, because a wall clock set back during the run would lengthen it.
    Symfony\Component\Clock\MonotonicClock: ~
    Intakt\Plugin\GitHubForge\Infrastructure\ForgeConnectionCheck:
        arguments:
            $appId: '%env(GITHUB_APP_ID)%'
            $installationId: '%env(GITHUB_APP_INSTALLATION_ID)%'
            $privateKey: '%env(GITHUB_APP_PRIVATE_KEY)%'
    Intakt\Plugin\GitHubForge\Infrastructure\GitHubAppSetting:
        arguments:
            $appId: '%env(GITHUB_APP_ID)%'
    # Lazy, so the forge can be built without an App (the demo) and the two settings are parsed only when a call first reaches GitHub.
    Intakt\Plugin\GitHubForge\Domain\ExpectedInstallation:
        lazy: true
        factory: ['Intakt\Plugin\GitHubForge\Domain\ExpectedInstallation', 'fromSettings']
        arguments: ['%env(GITHUB_APP_PERMISSIONS)%', '%env(GITHUB_APP_REPOSITORIES)%']
    # Empty while no maintainer App runs, so no bot but Intakt's own steers.
    Intakt\Plugin\GitHubForge\Infrastructure\SteeringIdentities:
        arguments:
            $maintainerAppSlug: '%env(GITHUB_MAINTAINER_APP_SLUG)%'

    # GitHub's, because the watcher lists pull requests through GitHubWatchReads, so every head its boot gate sees is a GitHub pull request.
    Intakt\Plugin\Forge\Contract\AuthorTrust: '@Intakt\Plugin\GitHubForge\Infrastructure\GitHubAuthorTrust'

    # Memory is written by the orchestrator only; the indexer is the AI bundle's, over the SQLite store in config/packages/ai.php.
    Intakt\Core\Memory\Contract\MemoryIndex: '@Intakt\Core\Memory\Infrastructure\StoreMemoryIndex'
    Symfony\AI\Store\Indexer\DocumentIndexer: '@ai.indexer.memory'
    Intakt\Core\Memory\Infrastructure\StoreMemoryIndex:
        arguments:
            $vectorizer: '@ai.vectorizer.memory'
            $store: '@ai.store.sqlite.memory'
    # Reviewers get the read side only; the Retriever is the AI bundle's, over the same store.
    Intakt\Core\Review\Infrastructure\OptionalProjectMemory:
        arguments:
            $memory: '@Intakt\Core\Memory\Infrastructure\StoreProjectMemory'
    Intakt\Core\Memory\Contract\ProjectMemory: '@Intakt\Core\Review\Infrastructure\OptionalProjectMemory'
    Symfony\AI\Store\Retriever: '@ai.retriever.memory'

    # Read only until the owner sets MCP_OWNER_ACCESS to mcp_tool_write; a write also needs the owner's bearer token.
    Intakt\Core\Mcp\Infrastructure\ToolAccessVoter:
        arguments:
            $highestAllowed: '%env(enum:Intakt\Core\Mcp\Contract\ToolAccess:MCP_OWNER_ACCESS)%'

    Intakt\Core\Mcp\Infrastructure\OwnerTokenHandler:
        arguments:
            $configuredToken: '%env(MCP_OWNER_TOKEN)%'

    # Read from inside the container only, because the admin API stays bound to localhost.
    Intakt\Core\Server\Infrastructure\AdminApi:
        arguments:
            $baseUrl: '%env(FRANKENPHP_ADMIN_URL)%'

    # Names only, because the values are read from the environment and the vault when a record is written; a name also holds an account's variable with its name appended.
    Intakt\Core\Platform\Infrastructure\HeldCredentials:
        arguments:
            $names: [APP_SECRET, MERCURE_JWT_SECRET, MCP_OWNER_TOKEN, GITHUB_APP_PRIVATE_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENAI_COMPATIBLE_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, HF_TOKEN]
            $vault: '@?secrets.vault'
            $kept: '@Intakt\Core\Ai\Contract\KeptProviderKeys'

    # Replaces the framework's fallback logger so every record is a redacted JSON line with the failure's class and trace on the service output (the journal), at every level INTAKT_LOG_LEVEL lets through.
    logger:
        class: Symfony\Component\HttpKernel\Log\Logger
        arguments:
            $minLevel: '%env(log_level:INTAKT_LOG_LEVEL)%'
            $output: 'php://stderr'
            $formatter: '@Intakt\Core\Platform\Infrastructure\RedactedJsonFormatter'

    Intakt\Core\Git\Domain\Mirrors:
        arguments:
            $directory: '%intakt.git.mirrors_directory%'
    # The same folder rule as the mirrors, over the archive's own directory.
    intakt.git.branch_archives:
        class: Intakt\Core\Git\Domain\Mirrors
        arguments:
            $directory: '%intakt.git.branch_archive_directory%'
    Intakt\Core\Git\Contract\BranchArchive: '@Intakt\Core\Git\UseCase\ArchiveBranch\MirrorBranchArchive'

    # Built from the forge's and the vendors' configuration, because its probes are values, not services.
    Intakt\Core\Outage\Infrastructure\ProbedConnectivity:
        factory: ['@Intakt\Core\Outage\Infrastructure\ConfiguredProbes', 'connectivity']
    Intakt\Core\Outage\Contract\Connectivity: '@Intakt\Core\Outage\Infrastructure\ProbedConnectivity'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@dev:
    services:
        # Messenger defines its collector only with APP_DEBUG=1; this definition, shared with when@test through its anchor so the two cannot drift, keeps messenger in a saved development profile and an opted-in test profile also with APP_DEBUG=0.
        data_collector.messenger: &messenger_data_collector
            class: Symfony\Component\Messenger\DataCollector\MessengerDataCollector
            tags:
                - { name: data_collector, id: messenger, template: '@WebProfiler/Collector/messenger.html.twig', priority: 100 }

when@test:
    imports:
        # In a PHPUnit run the logger records into the run's file, so the run prints no log lines and an unasserted error fails its test.
        - { resource: '../tests/Support/services.yaml', ignore_errors: not_found }
        # Handlers that prove the bus separation live in tests/ (src/ has no handler yet); an installed instance ships without tests/.
        - { resource: '../tests/Core/Platform/services.yaml', ignore_errors: not_found }
        # A write tool that proves, through the whole server, that a tool the voter refuses does not run.
        - { resource: '../tests/Core/Mcp/services.yaml', ignore_errors: not_found }
        # The secret scan as the container wires it, so its test proves the INTAKT_GITLEAKS binding.
        - { resource: '../tests/Plugin/GitHubForge/services.yaml', ignore_errors: not_found }
        # Recorded pull requests and CI runs in place of the GitHub forge, so a tick in the test environment runs without reaching GitHub.
        - { resource: '../tests/Core/Watcher/services.yaml', ignore_errors: not_found }
        # Recorded issues in place of the GitHub forge's issue reads, so intakt:build:task in the test environment runs without reaching GitHub.
        - { resource: '../tests/Core/Build/services.yaml', ignore_errors: not_found }
        # The start guard under a public test name, so its test proves the alias this file wires and the ceilings config/packages/ai.php binds.
        - { resource: '../tests/Core/Budget/services.yaml', ignore_errors: not_found }
        # A vendor that never calls a model and a hub that records, so a journey runs a review round on an instance and reads what the dashboard published.
        - { resource: '../tests/Journeys/services.yaml', ignore_errors: not_found }
        # The pinned provider cooldowns under a public test name, so their test proves the store the container builds even when no provider is enabled to take it.
        - { resource: '../tests/Core/Ai/services.yaml', ignore_errors: not_found }
        # The eligibility labels under a public test name, and the recorded reads intakt:queue:show makes after the listing, so a test and an install without GitHub prove the label and the queue the container hands out.
        - { resource: '../tests/Plugin/GitHubWorkSource/services.yaml', ignore_errors: not_found }
        # The team roster under a public test name, so a test proves the accounts and states it reads from the config file before a page uses it.
        - { resource: '../tests/Core/Dashboard/services.yaml', ignore_errors: not_found }
        # Disk readings a test sets, and the disk check under a public test name, so a test proves the floors the container binds hold and release work.
        - { resource: '../tests/Core/Disk/services.yaml', ignore_errors: not_found }
    services:
        # The development definition above, through its anchor, so an opted-in test profile keeps messenger also with APP_DEBUG=0.
        data_collector.messenger: *messenger_data_collector
        # In the worker's own cache directory, because the tests gate runs workers side by side and a lock one worker holds would skip another's notice.
        Symfony\Component\Lock\Store\FlockStore:
            arguments: ['%kernel.cache_dir%/locks']
