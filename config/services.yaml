# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    !php/const Intakt\Plugin\SymfonyAiVendor\Contract\SymfonyAiVendorServices::ACCOUNT_PARALLEL_CALLS: 3
    # The scanner when INTAKT_GITLEAKS is unset or empty, as for the secrets gates.
    !php/const Intakt\Plugin\GitHubForge\Contract\GitHubForgeServices::GITLEAKS: gitleaks
    # The engine's own socket, because the orchestrator runs Docker inside its container and so shares the paths it mounts.
    !php/const Intakt\Core\Job\Contract\JobServices::DOCKER_SOCKET: /var/run/docker.sock
    # The share of a GitHub installation's hourly budget kept for essential calls (0 to 100); below it, each project's listing runs once per watcher tick.
    !php/const Intakt\Plugin\GitHubForge\Contract\GitHubForgeServices::RESERVE_PERCENT: 20
    # One bare mirror per project lives here, rebuilt from the remote if lost.
    !php/const Intakt\Core\Git\Contract\GitServices::MIRRORS_DIRECTORY: '%kernel.project_dir%/var/mirrors'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Intakt\:
        resource: '../src/'
        exclude:
            # Built per review with the checkout under review, so the container cannot wire them.
            - '../src/Core/Review/Infrastructure/Repository/'
            # Defined below, because the scan would alias the forge writes to the guard itself while it is their only class.
            - '../src/Core/Shadow/Infrastructure/ModeGuardedForgeWrites.php'
            # Defined in config/packages/ai.php beside the parameters they read, because the scan runs later and would replace those definitions.
            - '../src/Core/Budget/Domain/CeilingStartGuard.php'
            - '../src/Core/Ai/UseCase/ProbeCodexLogin/ProbeCodexLoginCommand.php'

    # Decorates whichever forge writes, so a forge plugin cannot forget the project mode's rule; dropped while no forge writes (plan task T18).
    Intakt\Core\Shadow\Infrastructure\ModeGuardedForgeWrites:
        decorates: Intakt\Plugin\Forge\Contract\ForgeWrites
        decoration_on_invalid: ignore

    # Wired here, because a Domain class carries no container attributes; its ceiling guards are wired in config/packages/ai.php.
    Intakt\Core\Budget\Contract\StartGuard: '@Intakt\Core\Budget\Domain\BudgetGuard'

    # Semaphores over file locks, because every worker runs on this host; Symfony's other semaphore store needs Redis.
    Symfony\Component\Lock\Store\FlockStore:
        arguments: ['%kernel.project_dir%/var/locks']
    Symfony\Component\Lock\LockFactory:
        arguments: ['@Symfony\Component\Lock\Store\FlockStore']
    Symfony\Component\Semaphore\Store\LockStore: ~
    Symfony\Component\Semaphore\SemaphoreFactory:
        arguments: ['@Symfony\Component\Semaphore\Store\LockStore']

    # Only the App's identity, because Intakt acts as itself, never with the owner's token (docs/guide/setting-up-intakt.md).
    Intakt\Plugin\GitHubForge\Infrastructure\AppJwt:
        arguments:
            $appId: '%env(GITHUB_APP_ID)%'
            $privateKey: '%env(GITHUB_APP_PRIVATE_KEY)%'
    Intakt\Plugin\GitHubForge\Infrastructure\PostedComments:
        arguments:
            $appId: '%env(GITHUB_APP_ID)%'
    Intakt\Plugin\GitHubForge\Infrastructure\InstallationTokens:
        arguments:
            $installationId: '%env(GITHUB_APP_INSTALLATION_ID)%'
    # Built when first needed, so only the installation check and the forge need the two settings.
    Intakt\Plugin\GitHubForge\Domain\ExpectedInstallation:
        factory: ['Intakt\Plugin\GitHubForge\Domain\ExpectedInstallation', 'fromSettings']
        arguments: ['%env(GITHUB_APP_PERMISSIONS)%', '%env(GITHUB_APP_REPOSITORIES)%']
    # Empty while no maintainer App runs, so no bot but Intakt's own steers.
    Intakt\Plugin\GitHubForge\Infrastructure\SteeringIdentities:
        arguments:
            $maintainerAppSlug: '%env(GITHUB_MAINTAINER_APP_SLUG)%'

    # Memory is written by the orchestrator only; the indexer is the AI bundle's, over the SQLite store in config/packages/ai.php.
    Intakt\Core\Memory\Contract\MemoryIndex: '@Intakt\Core\Memory\Infrastructure\StoreMemoryIndex'
    Symfony\AI\Store\Indexer\DocumentIndexer: '@ai.indexer.memory'
    # Reviewers get the read side only; the Retriever is the AI bundle's, over the same store.
    Intakt\Core\Review\Infrastructure\OptionalProjectMemory:
        arguments:
            $memory: '@Intakt\Core\Memory\Infrastructure\StoreProjectMemory'
    Intakt\Core\Memory\Contract\ProjectMemory: '@Intakt\Core\Review\Infrastructure\OptionalProjectMemory'
    Symfony\AI\Store\Retriever: '@ai.retriever.memory'

    # Read only until the owner sets MCP_OWNER_ACCESS to mcp_tool_write; a write also needs the owner's bearer token.
    Intakt\Core\Mcp\Infrastructure\ToolAccessVoter:
        arguments:
            $highestAllowed: '%env(enum:Intakt\Core\Mcp\Contract\ToolAccess:MCP_OWNER_ACCESS)%'

    Intakt\Core\Mcp\Infrastructure\OwnerTokenHandler:
        arguments:
            $configuredToken: '%env(MCP_OWNER_TOKEN)%'

    # Read from inside the container only, because the admin API stays bound to localhost.
    Intakt\Core\Server\Infrastructure\AdminApi:
        arguments:
            $baseUrl: '%env(FRANKENPHP_ADMIN_URL)%'

    # Names only, because the values are read from the environment and the vault when a record is written; a name also holds an account's variable with its name appended.
    Intakt\Core\Platform\Infrastructure\HeldCredentials:
        arguments:
            $names: [APP_SECRET, MERCURE_JWT_SECRET, MCP_OWNER_TOKEN, GITHUB_APP_PRIVATE_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENAI_COMPATIBLE_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, HF_TOKEN]
            $vault: '@?secrets.vault'

    # Replaces the framework's fallback logger so every record is a redacted JSON line with the failure's class and trace on the service output (the journal).
    logger:
        class: Symfony\Component\HttpKernel\Log\Logger
        arguments:
            $minLevel: warning
            $output: 'php://stderr'
            $formatter: '@Intakt\Core\Platform\Infrastructure\RedactedJsonFormatter'

    Intakt\Core\Git\UseCase\UpdateMirror\UpdateMirror:
        arguments:
            $mirrorsDirectory: '%intakt.git.mirrors_directory%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    imports:
        # In a PHPUnit run the logger records into the run's file, so the run prints no log lines and an unasserted error fails its test.
        - { resource: '../tests/Support/services.yaml', ignore_errors: not_found }
        # Handlers that prove the bus separation live in tests/ (src/ has no handler yet); an installed instance ships without tests/.
        - { resource: '../tests/Core/Platform/services.yaml', ignore_errors: not_found }
        # A write tool that proves, through the whole server, that a tool the voter refuses does not run.
        - { resource: '../tests/Core/Mcp/services.yaml', ignore_errors: not_found }
        # No forge writes yet (plan task T18), so the tests give the container one that refuses every write.
        - { resource: '../tests/Core/Shadow/services.yaml', ignore_errors: not_found }
        # The secret scan as the container wires it, so its test proves the INTAKT_GITLEAKS binding.
        - { resource: '../tests/Plugin/GitHubForge/services.yaml', ignore_errors: not_found }
        # Recorded pull requests and CI runs, so a tick runs on an install in the test environment while no forge lists them (plan task T18).
        - { resource: '../tests/Core/Watcher/services.yaml', ignore_errors: not_found }
        # The start guard under a public test name, so its test proves the alias this file wires and the ceilings config/packages/ai.php binds.
        - { resource: '../tests/Core/Budget/services.yaml', ignore_errors: not_found }
        # A vendor that never calls a model and a hub that records, so a journey runs a review round on an instance and reads what the dashboard published.
        - { resource: '../tests/Journeys/services.yaml', ignore_errors: not_found }
    services:
        # In the worker's own cache directory, because the tests gate runs workers side by side and a lock one worker holds would skip another's notice.
        Symfony\Component\Lock\Store\FlockStore:
            arguments: ['%kernel.cache_dir%/locks']
