# The demo: run docker compose up -d --wait; no file needs editing. Provider keys can be set in .env.local (copy .env.dist), and the secrets are made on the first start unless set there.
services:
    intakt:
        build: .
        env_file:
            - path: .env.local
              required: false
        environment:
            # On the data volume, so the seeded project and the sample repository survive a restart and the seed runs once.
            INTAKT_CONFIG: /app/var/data/intakt.yaml
            INTAKT_SAMPLE_REPOSITORY: /app/var/data/sample-repository
            # Where the entrypoint keeps the MCP owner token. Set here, not exported by the entrypoint, so commands run by docker compose exec read the same file.
            MCP_OWNER_KEPT_FILE: /app/var/data/mcp-owner-token
            # The service's own name, so the printed review command runs from the host shell in this folder.
            INTAKT_COMPOSE_SERVICE: intakt
        ports:
            # Loopback only, because the dashboard is the owner's alone; the port matches DASHBOARD_PORT in the image.
            - 127.0.0.1:7781:7781
        volumes:
            - intakt-data:/app/var/data
        healthcheck:
            # Green only once the dashboard answers and the sample is seeded; the short interval lets docker compose up --wait return soon after.
            test: ["CMD", "intakt-healthcheck"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
            start_interval: 2s

volumes:
    intakt-data:
