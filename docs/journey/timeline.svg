anned, 84 parked</text><text x="150" y="838" font-size="12" fill="#0b0b0b">First clean-machine run of the judged path finds four defects</text><text x="150" y="856" font-size="12" fill="#0b0b0b">Trials of the claude_code and Codex reviewers</text><text x="150" y="874" font-size="12" fill="#0b0b0b">Cooldown exception for Symfony 8.2.0-BETA2 (installed on 11-15 in #1960)</text><circle cx="62" cy="896" r="4" fill="#2a78d6"/><text x="76" y="900" font-size="12" font-weight="600" fill="#0b0b0b">11-14</text><text x="150" y="900" font-size="12" fill="#0b0b0b">Three fixes sent upstream already in the beta</text><text x="150" y="918" font-size="12" fill="#0b0b0b">Review bench repository</text><text x="150" y="936" font-size="12" fill="#0b0b0b">Review figures labeled measured, counted or estimated</text><text x="56" y="974" font-size="13" font-weight="600" fill="#52514e">Deadline</text><line x1="56" x2="904" y1="982" y2="982" stroke="#e6e5e1" stroke-width="1"/><circle cx="62" cy="1000" r="4" fill="#2a78d6"/><text x="76" y="1004" font-size="12" font-weight="600" fill="#0b0b0b">11-21</text><text x="150" y="1004" font-size="12" fill="#0b0b0b">Demo (planned)</text><circle cx="62" cy="1026" r="4" fill="#2a78d6"/><text x="76" y="1030" font-size="12" font-weight="600" fill="#0b0b0b">11-22</text><text x="150" y="1030" font-size="12" fill="#0b0b0b">Hackathon deadline 18:00 CET, repository public</text></svg>
