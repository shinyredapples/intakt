<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 280" width="480" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Intakt roadmap</title>
  <desc id="desc">Started 24 Oct by a custom build loop. Done: M0 Unblock, M1 Review core, M2 Panel and rounds, M3 Agents and memory, M4 Live dashboard, M5 Demo, the hackathon release, 22 Nov. We are here: M6 Reviewer for the loop, which reviews the build loop's changes. Next: M7 Builder half, M8 Switch.</desc>
  <style>
    text { font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; fill: #E6ECEA; }
    .id { font-family: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    .sub { font-size: 15px; fill: #9AA8A4; }
    .next { fill: #9AA8A4; }
  </style>
  <text x="12" y="23" class="id">Done</text>
  <path d="M20 50 V266 Q20 274 28 274 H244 Q252 274 252 266 V68 Q252 60 260 60 H270" fill="none" stroke="#3CC29C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="270" y1="76" x2="270" y2="200" stroke="#9AA8A4" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="20" cy="50" r="8" fill="#3CC29C"/>
  <text x="36" y="56"><tspan class="id">Start</tspan> 24 Oct</text>
  <text x="36" y="76" class="sub">custom build loop</text>
  <circle cx="20" cy="100" r="8" fill="#3CC29C"/>
  <text x="36" y="106"><tspan class="id">M0</tspan> Unblock</text>
  <circle cx="20" cy="128" r="8" fill="#3CC29C"/>
  <text x="36" y="134"><tspan class="id">M1</tspan> Review core</text>
  <circle cx="20" cy="156" r="8" fill="#3CC29C"/>
  <text x="36" y="162"><tspan class="id">M2</tspan> Panel and rounds</text>
  <circle cx="20" cy="184" r="8" fill="#3CC29C"/>
  <text x="36" y="190"><tspan class="id">M3</tspan> Agents and memory</text>
  <circle cx="20" cy="212" r="8" fill="#3CC29C"/>
  <text x="36" y="218"><tspan class="id">M4</tspan> Live dashboard</text>
  <circle cx="20" cy="240" r="8" fill="#3CC29C"/>
  <text x="36" y="246"><tspan class="id">M5</tspan> Demo</text>
  <text x="36" y="266" class="sub">Hackathon release, 22 Nov</text>
  <circle cx="270" cy="60" r="15" fill="#332816" stroke="#F2A541" stroke-width="3"/>
  <circle cx="270" cy="60" r="8" fill="#1E9A7A"/>
  <text x="292" y="66"><tspan class="id">M6</tspan> Reviewer for the loop</text>
  <text x="292" y="86" class="sub">reviews the build</text>
  <text x="292" y="104" class="sub">loop's changes</text>
  <circle cx="270" cy="150" r="7" fill="#18201E" stroke="#9AA8A4" stroke-width="2.5"/>
  <text x="292" y="156" class="next"><tspan class="id">M7</tspan> Builder half</text>
  <text x="292" y="176" class="sub next">builds, not just reviews</text>
  <circle cx="270" cy="200" r="7" fill="#18201E" stroke="#9AA8A4" stroke-width="2.5"/>
  <text x="292" y="206" class="next"><tspan class="id">M8</tspan> Switch</text>
  <text x="292" y="226" class="sub next">builds itself</text>
  <image x="412" y="2" width="60" height="60" href="data:image/webp;base64," xlink:href="data:image/webp;base64,"/>
  <rect x="256" y="4" width="124" height="26" rx="13" fill="#332816" stroke="#F2A541" stroke-width="1.5"/>
