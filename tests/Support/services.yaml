services:
    # A clock the tests pin, because replacing the framework's clock with set() throws once anything has created it; outside a PHPUnit run the real clock stays.
    intakt.test.pinnable_clock:
        class: Symfony\Component\Clock\ClockInterface
        decorates: clock
        factory: ['Intakt\Tests\Support\PinnableClockFactory', 'create']
        arguments: ['@.inner']

    # Records into the PHPUnit run's file instead of the logger's stderr; outside a PHPUnit run the redacted JSON logger stays, so an instance keeps its server log.
    intakt.test.recording_logger:
        class: Psr\Log\LoggerInterface
        decorates: logger
        factory: ['Intakt\Tests\Support\Log\RecordingLoggerFactory', 'create']
        arguments: ['@.inner']

    # Lets a test add a listener for its own kernel's lifetime: with APP_DEBUG=0 the framework's dispatcher is compiled, and adding to it is deprecated.
    intakt.test.scoped_event_dispatcher:
        class: Symfony\Component\EventDispatcher\ScopedEventDispatcher
        decorates: event_dispatcher
        arguments: ['@.inner']

    # Set by a reviewer test once its scripted run is done; declared synthetic so the container, and static analysis, know the id it is set under.
    test.reviewer_agent.ai_data_collector:
        class: Symfony\AI\AiBundle\Profiler\DataCollector
        synthetic: true
        public: true

    test.reviewer_verdict.ai_data_collector:
        class: Symfony\AI\AiBundle\Profiler\DataCollector
        synthetic: true
        public: true

    # Runs the step a worker-mode test hands its request, ahead of every other listener, because the compiled dispatcher takes no listener at runtime.
    Intakt\Tests\Application\RunRequestStep:
        autoconfigure: true

    # Lists no variable, so it changes no value; it shows that the kept provider key's loader is handed every other env loader, as the framework's vault loader is where a vault directory exists.
    intakt.test.empty_env_var_loader:
        class: Intakt\Tests\Core\Ai\Infrastructure\FixedEnvVars
        arguments: [{}]
        tags: ['container.env_var_loader']
        public: true

    Intakt\Tests\Support\UnsyncedSqlite:
        tags: ['doctrine.middleware']
