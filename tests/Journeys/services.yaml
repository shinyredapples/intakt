services:
    # Every review in the test environment goes to this vendor, so a journey's round ends without a key or a provider.
    Intakt\Tests\Journeys\Support\JourneyVendor: ~
    Intakt\Plugin\Vendor\Contract\Vendor: '@Intakt\Tests\Journeys\Support\JourneyVendor'

    # In the share directory, because a journey's cache:clear would remove a recording kept in the cache directory.
    Intakt\Tests\Journeys\Support\RecordingHub:
        decorates: mercure.hub.default
        arguments: ['@.inner', '%kernel.share_dir%']
