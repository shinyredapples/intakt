parameters:
    # Empty unless a run of intakt:build:task names a recording, so the container builds without one.
    env(BUILD_RECORDING): ''
    # Empty unless a run of intakt:build:task names the folder the scripted build job hands back.
    env(BUILD_JOB_OUTPUT): ''

services:
    Intakt\Tests\Core\Build\RecordedIssues:
        autowire: true
    Intakt\Plugin\GitHubForge\Contract\IssueReads: '@Intakt\Tests\Core\Build\RecordedIssues'
    Intakt\Tests\Core\Build\ScriptedJobRunner:
        autowire: true
    Intakt\Tests\Core\Build\LocalChangeOpening: ~
    Intakt\Plugin\Forge\Contract\ChangeOpening: '@Intakt\Tests\Core\Build\LocalChangeOpening'
    # Only the build and check jobs' runner, because the review jobs keep the container runner their own tests use; the check job reads check-result from the same folder.
    Intakt\Core\Build\UseCase\RunBuildJob\RunBuildJob:
        autowire: true
        arguments:
            $jobs: '@Intakt\Tests\Core\Build\ScriptedJobRunner'
    Intakt\Core\HandBack\UseCase\RunCheckJob\RunCheckJob:
        autowire: true
        arguments:
            $jobs: '@Intakt\Tests\Core\Build\ScriptedJobRunner'
    # The check's probe and install jobs too, so a check never reaches a container engine; a folder without a platform file leaves the check without a snapshot.
    Intakt\Core\HandBack\UseCase\RunCheckJob\DependencyJobs:
        autowire: true
        arguments:
            $jobs: '@Intakt\Tests\Core\Build\ScriptedJobRunner'
