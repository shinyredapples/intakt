services:
    _defaults:
        autowire: true
        autoconfigure: true

    Intakt\Tests\Core\Mcp\Contract\Tool\:
        resource: 'Contract/Tool/'

    # The start tool runs the real review on a stored round, without workers or a configured panel: the waiting review's sleeps run the workers, a scripted vendor answers, and a panel of one reviews.
    # Not autoconfigured, so these workers are no message handlers of the bus and the configured vendor stays everywhere else.
    intakt.test.mcp.reviewer_worker:
        class: Intakt\Core\Review\UseCase\RunReviewRound\ReviewWithReviewerHandler
        autoconfigure: false
        arguments: { $vendor: '@Intakt\Tests\Core\Mcp\Contract\Tool\OneFindingVendor' }
    intakt.test.mcp.judge_worker:
        class: Intakt\Core\Review\UseCase\JudgeRound\JudgeRoundHandler
        autoconfigure: false
        arguments: { $vendor: '@Intakt\Tests\Core\Mcp\Contract\Tool\OneFindingVendor' }
    intakt.test.mcp.review_change:
        class: Intakt\Core\Review\UseCase\ReviewChange\ReviewChange
        autoconfigure: false
        public: true
        arguments: { $clock: '@Intakt\Tests\Core\Mcp\Contract\Tool\WorkersOnSleep' }
    # Public so the SDK client test can take them out of the container; it swaps them in for the contracts itself, so no other test gets them.
    Intakt\Tests\Core\Mcp\Contract\Tool\OnePanel:
        public: true

    # The owner server also serves the test tools, which an install without tests/ lacks, so the pattern comes with them.

mcp:
    servers:
        owner:
            registry:
                tools: ['Intakt\Tests\Core\Mcp\']
