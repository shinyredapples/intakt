name: deploy
on:
- push
- pull_request_target
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ${{ vars.DEPLOY_RUNNER }}
    steps:
      - if: >-
          github.ref == 'refs/heads/main' &&
          secrets.DEPLOY_KEY != ''
        run: ./deploy.sh
  build:
    runs-on: [self-hosted, linux]
    steps:
      - run: make
